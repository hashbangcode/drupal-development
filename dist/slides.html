<h2 id="drush-1">Drush</h2>
<ul>
<li>Drush is a command line tool that allows you to interact with Drupal.</li>
<li>Almost anything you can do through the inferface can be done through Drush.</li>
<li>Most useful for clearing Drupal caches, logging in, managing configuration, and performing updates.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {

<h2 id="drush-2">Drush</h2>
<ul>
<li>To install Drush require it through composer.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>composer require drush/drush
</code></pre>
<ul>
<li>You can now ensure drush is installed by running Drush on its own.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>./vendor/bin/drush
</code></pre>
<ul>
<li>This will tell you the commands available.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<h2 id="drush---commands-1">Drush - Commands</h2>

<li>Clear Drupal caches using the <code>cache:rebuild</code> or <code>cr</code> command.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>./vendor/bin/drush cache:rebuild

<h2 id="drush---commands-2">Drush - Commands</h2>
<ul>
<li>Log in as the admin user with the <code>user:login</code> or <code>uli</code> command.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>./vendor/bin/drush user:login
./vendor/bin/drush uli
</code></pre>
<ul>

<h2 id="setting-up-drupal">Setting Up Drupal</h2>
<ul>
<li>Lots of options exist to ease development in Drupal.</li>
<li>This includes turning off the Drupal cache, forcing autodiscovery of templates and services on every page load and preventing permission hardening.</li>
<li>Adding these options makes Drupal development easier.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<h2 id="setting-up-drupal-1">Setting Up Drupal</h2>
<ul>
<li>Let's change some settings to make development easier.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="setting-up-drupal-2">Setting Up Drupal</h2>
<ul>
<li>Drupal has a <code>site/example.settings.local.php</code> file.</li>
<li>Copy this to <code>site/default/settings.local.php</code>.</li>
<li>You can use this command.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>cp site/example.settings.local.php site/default/settings.local.php
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="setting-up-drupal-3">Setting Up Drupal</h2>
<ul>
<li>Uncomment the following from the bottom of the <code>sites/default/settings.php</code> file.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">if</span> (<span class="hljs-title function_ invoke__">file_exists</span>(<span class="hljs-variable">$app_root</span> . <span class="hljs-string">&#x27;/&#x27;</span> . <span class="hljs-variable">$site_path</span> . <span class="hljs-string">&#x27;/settings.local.php&#x27;</span>)) {
  <span class="hljs-keyword">include</span> <span class="hljs-variable">$app_root</span> . <span class="hljs-string">&#x27;/&#x27;</span> . <span class="hljs-variable">$site_path</span> . <span class="hljs-string">&#x27;/settings.local.php&#x27;</span>;
}
</code></pre>
<ul>
<li>Note: You may need to reset permissions on the settings.php file using <code>chmod</code>.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<h2 id="setting-up-drupal-4">Setting Up Drupal</h2>
<ul>
<li>Drupal will check the permissions of your settings.php files and ensure they are secure.</li>
<li>If they aren't Drupal will set them correctly, which makes altering settings.php files difficult.</li>
<li>To turn this off make sure this setting is enabled.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$settings</span>[<span class="hljs-string">&#x27;skip_permissions_hardening&#x27;</span>] = <span class="hljs-literal">TRUE</span>;
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

<h2 id="setting-up-drupal-5">Setting Up Drupal</h2>
<ul>
<li>To turn off the permanent caches uncomment any line that looks like this.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$settings</span>[<span class="hljs-string">&#x27;cache&#x27;</span>][<span class="hljs-string">&#x27;bins&#x27;</span>][<span class="hljs-string">&#x27;x&#x27;</span>] = <span class="hljs-string">&#x27;cache.backend.null&#x27;</span>;
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<h2 id="setting-up-drupal-6">Setting Up Drupal</h2>
<ul>
<li>The settings.local.php file will also include a <code>sites/development.services.yml</code> file.</li>
<li>This turns on cacheability headers and turns allows backend cache classes to be pucked up.</li>
<li>The file looks like this.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yml"><span class="hljs-attr">parameters:</span>
  <span class="hljs-attr">http.response.debug_cacheability_headers:</span> <span class="hljs-literal">true</span>
<span class="hljs-attr">services:</span>
  <span class="hljs-attr">cache.backend.null:</span>
    <span class="hljs-attr">class:</span> <span class="hljs-string">Drupal\Core\Cache\NullBackendFactory</span>
</code></pre>
</section>

<li>Twig debugging and auto reload are configured in the <code>sites/development.services.yml</code> file.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yml"><span class="hljs-attr">parameters:</span>
  <span class="hljs-attr">twig.config:</span>
    <span class="hljs-attr">debug:</span> <span class="hljs-literal">true</span>
    <span class="hljs-attr">auto_reload:</span> <span class="hljs-literal">true</span>
    <span class="hljs-attr">cache:</span> <span class="hljs-literal">false</span>
  <span class="hljs-attr">http.response.debug_cacheability_headers:</span> <span class="hljs-literal">true</span>
<span class="hljs-attr">services:</span>
  <span class="hljs-attr">cache.backend.null:</span>
    <span class="hljs-attr">class:</span> <span class="hljs-string">Drupal\Core\Cache\NullBackendFactory</span>
</code></pre>

<h2 id="what-is-a-module">What Is A Module?</h2>
<ul>
<li>Adds a feature to a site.</li>
<li>Can be turned on or off.</li>
<li>Can define extra functionality or hook into and override other parts of Drupal.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<h2 id="types-of-module">Types Of Module</h2>
<ul>
<li><strong>Core</strong> - Included in Drupal itself.</li>
<li><strong>Contributed</strong> - Any third party module you install. Referred to as &quot;contrib&quot;.</li>
<li><strong>Custom</strong> - Any module you build yourself.</li>
</ul>

<p>The simplest building block of any module.</p>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="what-is-a-hook">What Is A Hook?</h2>
<p>Hooks allow you to:</p>
<ul>
<li>Alter forms.</li>
<li>Alter theme elements before rendering.</li>
<li>React to events.</li>
<li>Register plugins and templates.</li>
</ul>
<p>Any module can define custom hooks.</p>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

}
" lang="C" class="lead invert" data-marpit-pagination="38" style="--paginate:true;--class:lead invert;--footer:Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1);--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="naming-hooks">Naming Hooks</h2>
<ul>
<li>Hooks are named after the module they appear in.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-title function_ invoke__">hook_form_alter</span>()
</code></pre>
<p>Becomes:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-title function_ invoke__">mymodule_form_alter</span>()
</code></pre>
<ul>
<li>The hook_form_alter() hook is called every time a form is created.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="naming-hooks-1">Naming Hooks</h2>
<ul>
<li>Some hooks also change their name based on context.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-title function_ invoke__">hook_node_insert</span>(<span class="hljs-variable">$entity</span>)
</code></pre>
<p>Is used to detect a node being inserted.</p>
<p>Can also be:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-title function_ invoke__">hook_user_insert</span>(<span class="hljs-variable">$entity</span>)
</code></pre>
<p>To detect users being inserted.</p>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">use</span> <span class="hljs-title">Drupal</span>\<span class="hljs-title">Core</span>\<span class="hljs-title">Form</span>\<span class="hljs-title">FormStateInterface</span>;

<span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">mymodule_form_alter</span>(<span class="hljs-params">&amp;<span class="hljs-variable">$form</span>,
FormStateInterface <span class="hljs-variable">$form_state</span>, <span class="hljs-variable">$form_id</span></span>) </span>{
 <span class="hljs-keyword">if</span> (<span class="hljs-variable">$form_id</span> == <span class="hljs-string">&#x27;node_article_form&#x27;</span>) {

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">use</span> <span class="hljs-title">Drupal</span>\<span class="hljs-title">Core</span>\<span class="hljs-title">Url</span>;

    ],
    <span class="hljs-string">&#x27;#weight&#x27;</span> =&gt; <span class="hljs-number">50</span>,
  ];
  <span class="hljs-keyword">return</span> <span class="hljs-variable">$items</span>;
}

<h2 id="translation-1">Translation</h2>
<ul>
<li>Why talk about multilingual code so early?</li>
<li>It's baked into everything Drupal does. Drupal is multilingual from the start.</li>
<li>You will see either t() or $this-&gt;t() a lot.</li>
<li>These functions will register the translation with the Drupal translation system.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="t-usage">t() Usage</h2>
<ul>
<li>To use both t() and $this-&gt;t() just pass in a string.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$translated</span> = <span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;String&#x27;</span>);
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$translated</span> = <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;String&#x27;</span>);
</code></pre>
<ul>
<li>Best practice is to pass it directly into where it is needed, rather than store in a variable.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="passing-arguments">Passing Arguments</h2>
<p>Pass escaped output (should be your default choice).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$t</span> = <span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;Value = @value&#x27;</span>, [<span class="hljs-string">&#x27;@value&#x27;</span> =&gt; <span class="hljs-string">&#x27;123&#x27;</span>]);
</code></pre>
<p>Wrap in &lt;em&gt; tags.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$t</span> = <span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;Value = %value&#x27;</span>, [<span class="hljs-string">&#x27;%value&#x27;</span> =&gt; <span class="hljs-string">&#x27;123&#x27;</span>]);
</code></pre>
<p>Escape (used for URLs)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$t</span> = <span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;&lt;a href=&quot;:url&quot;&gt;@variable&lt;/a&gt;&#x27;</span>,
  [<span class="hljs-string">&#x27;:url&#x27;</span> =&gt; <span class="hljs-variable">$url</span>, <span class="hljs-string">&#x27;@variable&#x27;</span> =&gt; <span class="hljs-variable">$variable</span>]);
</code></pre>
</section>

<h2 id="controllers-1">Controllers</h2>
<ul>
<li>Page responses in Drupal are created by a <strong>Controller</strong>. This can be a page of content or an API response.</li>
<li>A controller is a PHP class that contains methods.</li>
<li>Methods that return page responces are called <strong>actions</strong>.</li>
<li>Actions are registered using <strong>Routes</strong>.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="controllers-2">Controllers</h2>
<ul>
<li>Parameters can be passed to the controller, which are registered with the route.</li>
<li>An action should return an array of content ready to be rendered or a response object.</li>
<li>Multiple routes can use the same controller with different action methods.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="routes">Routes</h2>
<ul>
<li>All controllers need a route.</li>
<li>This tells Drupal what controller to use when a path is requested.</li>
<li>Defined in a *.routes.yml file.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="routes-1">Routes</h2>
<p>Create a file at mymodule.routing.yml.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yml"><span class="hljs-attr">mymodule.controller_action:</span>
  <span class="hljs-attr">path:</span> <span class="hljs-string">&#x27;/mycontroller/action&#x27;</span>
  <span class="hljs-attr">defaults:</span>
    <span class="hljs-attr">_controller:</span> <span class="hljs-string">&#x27;\Drupal\mymodule\Controller\MyController::action&#x27;</span>
    <span class="hljs-attr">_title:</span> <span class="hljs-string">&#x27;My Controller&#x27;</span>
  <span class="hljs-attr">requirements:</span>
    <span class="hljs-attr">_access:</span> <span class="hljs-string">&#x27;TRUE&#x27;</span>
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="controller">Controller</h2>
<p>A basic controller class looks like this.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-meta">&lt;?php</span>

<span class="hljs-keyword">namespace</span> <span class="hljs-title class_">Drupal</span>\<span class="hljs-title class_">mymodule</span>\<span class="hljs-title class_">Controller</span>;

<span class="hljs-keyword">use</span> <span class="hljs-title">Drupal</span>\<span class="hljs-title">Core</span>\<span class="hljs-title">Controller</span>\<span class="hljs-title">ControllerBase</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">MyController</span> <span class="hljs-keyword">extends</span> <span class="hljs-title">ControllerBase</span> </span>{
  <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">action</span>(<span class="hljs-params"></span>) </span>{
    <span class="hljs-comment">// return a render array or a new response object.</span>
  }
}

</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {

" lang="C" class="lead invert" data-marpit-pagination="56" style="--paginate:true;--class:lead invert;--footer:Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1);--theme:uncover;--style:.small-text {

}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="controller-return-a-response">Controller Return A Response</h2>
<p>Return a Response() object.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">namespace</span> <span class="hljs-title class_">Drupal</span>\<span class="hljs-title class_">mymodule</span>\<span class="hljs-title class_">Controller</span>;

<span class="hljs-keyword">use</span> <span class="hljs-title">Drupal</span>\<span class="hljs-title">Core</span>\<span class="hljs-title">Controller</span>\<span class="hljs-title">ControllerBase</span>;
<span class="hljs-keyword">use</span> <span class="hljs-title">Symfony</span>\<span class="hljs-title">Component</span>\<span class="hljs-title">HttpFoundation</span>\<span class="hljs-title">Response</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">MyController</span> <span class="hljs-keyword">extends</span> <span class="hljs-title">ControllerBase</span> </span>{
  <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">action</span>(<span class="hljs-params"></span>) </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Response</span>(<span class="hljs-string">&#x27;Response.&#x27;</span>);
  }
}

</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {

}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="different-types-of-response-objects-exist">Different Types Of Response Objects Exist</h2>
<ul>
<li><strong>Response</strong> - Text based response.</li>
<li><strong>HtmlResponse</strong> - A HTML response.</li>
<li><strong>JsonResponse</strong> - JSON response.</li>
<li><strong>XmlResponse</strong> - XML response.</li>
<li><strong>RedirectResponse</strong> - Redirect to another page.</li>
<li><strong>CacheableResponse</strong> - A response that contains Drupal cache metadata.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="render-arrays-1">Render Arrays</h2>
<ul>
<li>Render arrays are a hierarchical structure of elements that Drupal will convert into markup.</li>
<li>This is how we generate output in Drupal.</li>
<li>Render arrays take a number of different parameters, but largely depend on what type of rendering you are trying to do.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="61" style="--paginate:true;--class:lead invert;--footer:Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1);--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="render-arrays-2">Render Arrays</h2>
<ul>
<li>Render arrays should be built up and returned as a single array from the rendering method.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">action</span>(<span class="hljs-params"></span>) </span>{
  <span class="hljs-variable">$build</span> = [];
  <span class="hljs-variable">$build</span>[<span class="hljs-string">&#x27;text&#x27;</span>] = [
    <span class="hljs-string">&#x27;#plain_text&#x27;</span> =&gt; <span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;Escaped text&#x27;</span>),
  ];
  <span class="hljs-keyword">return</span> <span class="hljs-variable">$build</span>;
}
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="62" style="--paginate:true;--class:lead invert;--footer:Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1);--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="render-arrays-3">Render Arrays</h2>
<p>There are 3 main ways to use a render array.</p>
<ul>
<li>Direct properties</li>
<li>Templates</li>
<li>Render element types</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-class="lead invert" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="63" style="--paginate:true;--class:lead invert;--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="render-arrays---direct-properties">Render Arrays - Direct Properties</h2>
<ul>
<li>Drupal will look for the presence of 'plain_text' or 'markup' in the render array.</li>
<li>These are used to generate either escaped text output or for simple blocks of HTML.</li>
<li>These should be used sparingly as theme and render elements allow of better control over markup.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="64" style="--paginate:true;--class:lead invert;--footer:Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1);--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="render-arrays---direct-properties-1">Render Arrays - Direct Properties</h2>
<p>The 'plain_text' property will fully escape all output.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$build</span>[<span class="hljs-string">&#x27;text&#x27;</span>] = [
  <span class="hljs-string">&#x27;#plain_text&#x27;</span> =&gt; <span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;Escaped text&#x27;</span>),
];
</code></pre>
<p>Output:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Escaped text
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-class="lead invert" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="65" style="--paginate:true;--class:lead invert;--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="render-arrays---direct-properties-2">Render Arrays - Direct Properties</h2>
<p>The 'markup' property will allow some HTML elements to be included in the output. Script tags will be escaped to prevent cross site scripting issues.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$build</span>[<span class="hljs-string">&#x27;markup&#x27;</span>] = [
  <span class="hljs-string">&#x27;#markup&#x27;</span> =&gt; <span class="hljs-string">&#x27;&lt;p&gt;&#x27;</span> . <span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;Markup&#x27;</span>) . <span class="hljs-string">&#x27;&lt;/p&gt;&#x27;</span>,
];
</code></pre>
<p>Output:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>&lt;p&gt;Markup&lt;/p&gt;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-class="lead invert" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="66" style="--paginate:true;--class:lead invert;--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="render-arrays---direct-properties-3">Render Arrays - Direct Properties</h2>
<p>The tags allows can be controlled via n 'allowed_tags' property.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$build</span>[<span class="hljs-string">&#x27;markup&#x27;</span>] = [
  <span class="hljs-string">&#x27;#markup&#x27;</span> =&gt; <span class="hljs-string">&#x27;&lt;p&gt;&#x27;</span> . <span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;Markup&#x27;</span>) . <span class="hljs-string">&#x27;&lt;/p&gt;&#x27;</span>,
  <span class="hljs-string">&#x27;#allowed_tags&#x27;</span> =&gt; [<span class="hljs-string">&#x27;div&#x27;</span>]
];
</code></pre>
<p>Output:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Markup
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="67" style="--paginate:true;--class:lead invert;--footer:Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1);--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="render-arrays---templates">Render Arrays - Templates</h2>
<ul>
<li>These are generated from the hook_theme() hook.</li>
<li>There are a few Drupal core templates, but any module can add more.</li>
<li>They use the 'theme' property in the render array.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-class="lead invert" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="68" style="--paginate:true;--class:lead invert;--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="render-arrays---templates-1">Render Arrays - Templates</h2>
<ul>
<li>The item_list template can be used to print a list of items.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$build</span>[<span class="hljs-string">&#x27;item_list&#x27;</span>] = [
  <span class="hljs-string">&#x27;#theme&#x27;</span> =&gt; <span class="hljs-string">&#x27;item_list&#x27;</span>,
  <span class="hljs-string">&#x27;#title&#x27;</span> =&gt; <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;Title&#x27;</span>),
  <span class="hljs-string">&#x27;#list_type&#x27;</span> =&gt; <span class="hljs-string">&#x27;ul&#x27;</span>,
  <span class="hljs-string">&#x27;#items&#x27;</span> =&gt; [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>,],
];
</code></pre>
<p>Output:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>&lt;h3&gt;Title&lt;/h3&gt;
&lt;ul&gt;&lt;li&gt;1&lt;/li&gt;&lt;li&gt;2&lt;/li&gt;&lt;li&gt;3&lt;/li&gt;&lt;/ul&gt;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-class="lead invert" data-theme="uncover" data-style=".small-text {

<h2 id="render-arrays---render-elements">Render Arrays - Render Elements</h2>
<ul>
<li>Render elements are classes that will render out content.</li>
<li>They are registered in Drupal through a plugin interface.</li>
<li>Default render elements are <code>ElementInterface</code> objects.</li>
<li>Form elements are also render elements, of the type <code>FormElementInterface</code>, which extends <code>ElementInterface</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-class="lead invert" data-theme="uncover" data-style=".small-text {

;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="render-arrays---render-elements-1">Render Arrays - Render Elements</h2>
<ul>
<li>Render elements use the 'type' property.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$build</span>[<span class="hljs-string">&#x27;link&#x27;</span>] = [
  <span class="hljs-string">&#x27;#type&#x27;</span> =&gt; <span class="hljs-string">&#x27;link&#x27;</span>,
  <span class="hljs-string">&#x27;#title&#x27;</span> =&gt; <span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;Link Example&#x27;</span>),
  <span class="hljs-string">&#x27;#url&#x27;</span> =&gt; <span class="hljs-title class_">\Drupal\Core\Url</span>::<span class="hljs-title function_ invoke__">fromRoute</span>(<span class="hljs-string">&#x27;entity.node.canonical&#x27;</span>,
    [<span class="hljs-string">&#x27;node&#x27;</span> =&gt; <span class="hljs-number">1</span>]),
];
</code></pre>
<p>Output:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/node/1&quot;</span>&gt;</span>Link Example<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span>
</code></pre>
</section>

<h2 id="menu-plugins">Menu Plugins</h2>
<ul>
<li>You can inject menu items into Drupals menu system.</li>
<li>Stored in the <code>*.links.menu.yml</code> file.</li>
<li>These menu items are not editable.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yml"><span class="hljs-attr">mymodule.controller_action:</span>
  <span class="hljs-attr">title:</span> <span class="hljs-string">&#x27;MyModule Controller&#x27;</span>
  <span class="hljs-attr">description:</span> <span class="hljs-string">&#x27;A controller with an action.&#x27;</span>
  <span class="hljs-attr">route_name:</span> <span class="hljs-string">mymodule.controller_action</span>
  <span class="hljs-attr">parent:</span> <span class="hljs-string">system.admin</span>
</code></pre>
<p>Menu link is created under /admin.</p>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<h2 id="passing-parameters-to-routes">Passing Parameters To Routes</h2>
<ul>
<li>This is known as adding a wildcard to a route.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yml"><span class="hljs-attr">mymodule.controller_action:</span>
  <span class="hljs-attr">path:</span> <span class="hljs-string">&#x27;/mycontroller/action/{parameter}&#x27;</span>
  <span class="hljs-attr">defaults:</span>
    <span class="hljs-attr">_controller:</span> <span class="hljs-string">&#x27;\Drupal\mymodule\Controller\MyController::action&#x27;</span>
    <span class="hljs-attr">_title:</span> <span class="hljs-string">&#x27;My Controller&#x27;</span>
  <span class="hljs-attr">requirements:</span>
    <span class="hljs-attr">_access:</span> <span class="hljs-string">&#x27;TRUE&#x27;</span>
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

<h2 id="controller-with-parameter">Controller With Parameter</h2>
<p>A basic controller looks like this.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-meta">&lt;?php</span>
<span class="hljs-keyword">namespace</span> <span class="hljs-title class_">Drupal</span>\<span class="hljs-title class_">mymodule</span>\<span class="hljs-title class_">Controller</span>;

<span class="hljs-keyword">use</span> <span class="hljs-title">Drupal</span>\<span class="hljs-title">Core</span>\<span class="hljs-title">Controller</span>\<span class="hljs-title">ControllerBase</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">MyController</span> <span class="hljs-keyword">extends</span> <span class="hljs-title">ControllerBase</span> </span>{
  <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">action</span>(<span class="hljs-params"><span class="hljs-variable">$parameter</span></span>) </span>{
    <span class="hljs-comment">// return a render array</span>
  }
}

</code></pre>
<p class="small-text">Note the name "parameter" needs to match the variable $parameter.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {

  <span class="hljs-attr">path:</span> <span class="hljs-string">&#x27;/mycontroller/action/{parameter}&#x27;</span>
  <span class="hljs-attr">defaults:</span>
    <span class="hljs-attr">_controller:</span> <span class="hljs-string">&#x27;\Drupal\mymodule\Controller\MyController::action&#x27;</span>

  <span class="hljs-attr">requirements:</span>
    <span class="hljs-attr">_permission:</span> <span class="hljs-string">&#x27;access content&#x27;</span>
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<h2 id="forms-1">Forms</h2>
<ul>
<li>In Drupal, all forms are generated using the Form API.</li>
<li>It's like a render array, but for form fields.</li>
<li>By default, all forms use POST.</li>
<li>They are registered using the routing.yml file.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {

" lang="C" class="lead invert" data-marpit-pagination="81" style="--paginate:true;--class:lead invert;--footer:Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1);--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="creating-a-form">Creating A Form</h2>
<p>Add a route to point to a Form class.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yml"><span class="hljs-attr">mymodule.form:</span>
  <span class="hljs-attr">path:</span> <span class="hljs-string">&#x27;/my-form&#x27;</span>
  <span class="hljs-attr">defaults:</span>
    <span class="hljs-attr">_form:</span> <span class="hljs-string">&#x27;\Drupal\mymodule\Form\MyForm&#x27;</span>
    <span class="hljs-attr">_title:</span> <span class="hljs-string">&#x27;My Form&#x27;</span>
  <span class="hljs-attr">requirements:</span>
    <span class="hljs-attr">_access:</span> <span class="hljs-string">&#x27;TRUE&#x27;</span>
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<h2 id="creating-a-form-1">Creating A Form</h2>
<ul>
<li>Add a class to the directory <code>src/Form/MyForm.php</code>.</li>
<li>Blueprint of a form class (<em>on next slide</em>).</li>
<li>The return of the buildForm() method is a form render array.</li>
</ul>

<h2 id="creating-a-form-2">Creating A Form</h2>
<ul>
<li>The form API is an extension of the render array.</li>
<li>Form elements extend the <code>FormElementInterface</code>.</li>
<li>The most common form elements are:
<ul>
<li>textfield</li>
<li>radios</li>
<li>checkbox</li>
<li>checkboxes</li>
<li>select</li>
<li>submit</li>
</ul>
</li>
<li>Normal render elements can also be used.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-class="lead invert" data-theme="uncover" data-style=".small-text {

;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="creating-a-from">Creating A From</h2>
<ul>
<li>The following is a simple form.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">buildForm</span>(<span class="hljs-params"><span class="hljs-keyword">array</span> <span class="hljs-variable">$form</span>, FormStateInterface <span class="hljs-variable">$form_state</span></span>) </span>{
  <span class="hljs-variable">$form</span>[<span class="hljs-string">&#x27;description&#x27;</span>] = [
    <span class="hljs-string">&#x27;#markup&#x27;</span> =&gt; <span class="hljs-string">&#x27;&lt;p&gt;&#x27;</span> . <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;Fill in the form&#x27;</span>) . <span class="hljs-string">&#x27;&lt;/p&gt;&#x27;</span>
  ];
  <span class="hljs-variable">$form</span>[<span class="hljs-string">&#x27;name&#x27;</span>] = [
    <span class="hljs-string">&#x27;#type&#x27;</span> =&gt; <span class="hljs-string">&#x27;textfield&#x27;</span>,
    <span class="hljs-string">&#x27;#title&#x27;</span> =&gt; <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;Name&#x27;</span>),
    <span class="hljs-string">&#x27;#required&#x27;</span> =&gt; <span class="hljs-literal">TRUE</span>,
  ];
  <span class="hljs-variable">$form</span>[<span class="hljs-string">&#x27;submit&#x27;</span>] = [
    <span class="hljs-string">&#x27;#type&#x27;</span> =&gt; <span class="hljs-string">&#x27;submit&#x27;</span>,
    <span class="hljs-string">&#x27;#value&#x27;</span> =&gt; <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;Submit&#x27;</span>),
  ];
  <span class="hljs-keyword">return</span> <span class="hljs-variable">$form</span>;
}
</code></pre>
</section>

<h2 id="form-submission">Form Submission</h2>
<ul>
<li>Form submissions automatically pass through the submitForm() method.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">submitForm</span>(<span class="hljs-params"><span class="hljs-keyword">array</span> &amp;<span class="hljs-variable">$form</span>,   
 FormStateInterface <span class="hljs-variable">$form_state</span></span>) </span>{
  <span class="hljs-variable">$name</span> = <span class="hljs-variable">$form_state</span>-&gt;<span class="hljs-title function_ invoke__">getValue</span>(<span class="hljs-string">&#x27;name&#x27;</span>);

  <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">messenger</span>()-&gt;<span class="hljs-title function_ invoke__">addStatus</span>(
    <span class="hljs-variable">$this</span>-&gt;<span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;Submitted the name %name&#x27;</span>, [<span class="hljs-string">&#x27;%name&#x27;</span> =&gt; <span class="hljs-variable">$name</span>]));
}
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<h2 id="form-validation">Form Validation</h2>
<ul>
<li>Form validation happens in the validateForm() method (if implemented).</li>
<li>If any errors are triggered then the submit handler is not called.</li>
<li>Note that if you set the field to be &quot;#required&quot; then it will automatically get validated.</li>
</ul>

<li>Nodes, users, comments, taxonomy terms are all entities.</li>

<h2 id="content-entities---bundles">Content Entities - Bundles</h2>

<li>Bundles inherit all of the functionality of the entity.</li>
<li>Think of them as extended classes.</li>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$node</span>-&gt;<span class="hljs-title function_ invoke__">getEntityTypeId</span>(); <span class="hljs-comment">// node</span>

<span class="hljs-variable">$node</span>-&gt;<span class="hljs-title function_ invoke__">getType</span>(); <span class="hljs-comment">// article</span>
</code></pre>
<ul>
<li>Use these methods to ensure that the entity type you want is correct.</li>
</ul>

<h2 id="content-entites---fields-1">Content Entites - Fields</h2>
<ul>
<li>Get a value from a field.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Get the first value.</span>
<span class="hljs-variable">$value</span> = <span class="hljs-variable">$entity</span>-&gt;<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&#x27;title&#x27;</span>)-&gt;value;
<span class="hljs-comment">// Get all values.</span>
<span class="hljs-variable">$value</span> = <span class="hljs-variable">$entity</span>-&gt;<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&#x27;title&#x27;</span>)-&gt;<span class="hljs-title function_ invoke__">getValue</span>()[<span class="hljs-number">0</span>][<span class="hljs-string">&#x27;value&#x27;</span>];
</code></pre>
<ul>
<li>Note that the 'value' attribute may change depending on the field type.</li>
<li>Entity references have the property <code>target_id</code>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$value</span> = <span class="hljs-variable">$entity</span>-&gt;<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&#x27;field_article_term&#x27;</span>)-&gt;target_id;

<h1 id="drupal-cache">Drupal Cache</h1>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

" lang="C" class="lead invert" data-marpit-pagination="111" style="--paginate:true;--class:lead invert;--footer:Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1);--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="drupal-cache-1">Drupal Cache</h2>
<ul>
<li>Drupal has a robust and dynamic cache system.</li>
<li>Can be used as a static cache bin or as a dynamic cache.</li>
<li>It's important to understand what the components are.</li>
<li>Ideally, you want to cache as much as possible in the page.</li>
<li>For anonymous users you typically want the entire page cached.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="112" data-paginate="true" data-class="lead invert" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="112" style="--paginate:true;--class:lead invert;--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="cache-meta-data">Cache Meta Data</h2>
<ul>
<li>Added to render arrays and plugins to inform Drupal about how to cache the data.</li>
<li>This can include cache expiry time, tags or context.</li>
<li>The cache will bubble up the page, adding to the cache information of parent elements.</li>
<li>The entire page cache is goverened by the cache meta data within it.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="113" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="113" style="--paginate:true;--class:lead invert;--footer:Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1);--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="cache-expiry-time">Cache Expiry Time</h2>
<ul>
<li>Sets the maximum time that the cache can be used for, in seconds.</li>
</ul>
<p>Cache for an hour.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-string">&#x27;#cache&#x27;</span> =&gt; [
  <span class="hljs-string">&#x27;max-age&#x27;</span> =&gt; <span class="hljs-number">3600</span>,
]
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="114" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="114" style="--paginate:true;--class:lead invert;--footer:Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1);--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="cache-expiry-time-1">Cache Expiry Time</h2>
<p>Cache forever.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-string">&#x27;#cache&#x27;</span> =&gt; [
  <span class="hljs-string">&#x27;max-age&#x27;</span> =&gt; <span class="hljs-title class_">\Drupal\Core\Cache\Cache</span>::<span class="hljs-variable constant_">PERMANENT</span>,
]
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="115" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="115" style="--paginate:true;--class:lead invert;--footer:Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1);--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="cache-tags">Cache Tags</h2>
<ul>
<li>Cached data can be cached to show that it refernces something.</li>
<li>This means that when upstream caches are cleared the tagged caches can also be cleared.</li>
<li>For example, a page of content is saved. The cache of that page can be flushed from cached pages, views or anywhere else it is used.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="116" data-paginate="true" data-class="lead invert" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="116" style="--paginate:true;--class:lead invert;--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="cache-tags-1">Cache Tags</h2>
<p>Create a cache tag for current user.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$cacheTags</span> = User:<span class="hljs-title function_ invoke__">load</span>(<span class="hljs-title class_">\Drupal</span>::<span class="hljs-title function_ invoke__">currentUser</span>()-&gt;<span class="hljs-title function_ invoke__">id</span>())-&gt;<span class="hljs-title function_ invoke__">getCacheTags</span>();
...
<span class="hljs-string">&#x27;#cache&#x27;</span> =&gt; [
  <span class="hljs-string">&#x27;tags&#x27;</span> =&gt; <span class="hljs-variable">$cacheTags</span>,
]
</code></pre>
<p>Create a cache tags for node 1 and node 2.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-string">&#x27;#cache&#x27;</span> =&gt; [
  <span class="hljs-string">&#x27;tags&#x27;</span> =&gt; [<span class="hljs-string">&#x27;node:1&#x27;</span>, <span class="hljs-string">&#x27;node:2&#x27;</span>],
]
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="117" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {
  font-size: 0.75rem;
}
" lang="C" class="lead invert" data-marpit-pagination="117" style="--paginate:true;--class:lead invert;--footer:Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1);--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="cache-contexts">Cache Contexts</h2>
<ul>
<li>This tells Drupal how to the data should be cached on the site.</li>
<li>For example, the context &quot;user.roles&quot; will store the cache for each user role.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-string">&#x27;#cache&#x27;</span> =&gt; [
  <span class="hljs-string">&#x27;contexts&#x27;</span> =&gt; [<span class="hljs-string">&#x27;user.roles&#x27;</span>, <span class="hljs-string">&#x27;url.path_is_front&#x27;</span>],
]
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="118" data-paginate="true" data-class="lead invert" data-footer="Philip Norton [hashbangcode.com](https://www.hashbangcode.com) [@hashbangcode](https://twitter.com/hashbangcode) [@philipnorton42](https://twitter.com/philipnorton42) [.](#1)" data-theme="uncover" data-style=".small-text {

}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="cache-contexts-1">Cache Contexts</h2>
<ul>
<li>Cache Contexts are hierarchical, so Drupal will cache the most granular variation to avoid unnecessary variations as they bubble up the layers.</li>
<li>For example, when caching a page per user its pointless to also cache a block on that page per user role.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="cache-methods">Cache Methods</h2>
<ul>
<li>Some plugins (e.g Blocks) extend the CacheableDependencyInterface interface.</li>
<li>This gives them access to the methods getCacheContexts(), getCacheTags(), and getCacheMaxAge().</li>
<li>The methods getCacheTags() getCacheContexts() must return an array informing Drupal of the tags and contexts.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="120" data-paginate="true" data-class="lead invert" data-theme="uncover" data-style=".small-text {

" lang="C" class="lead invert" data-marpit-pagination="120" style="--paginate:true;--class:lead invert;--theme:uncover;--style:.small-text {
  font-size: 0.75rem;
}
;" data-marpit-pagination-total="204" data-size="16:9"><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">getCacheTags</span>(<span class="hljs-params"></span>) </span>{
  <span class="hljs-comment">// With this when your node change your block will rebuild.</span>
  <span class="hljs-keyword">if</span> (<span class="hljs-variable">$node</span> = <span class="hljs-title class_">\Drupal</span>::<span class="hljs-title function_ invoke__">routeMatch</span>()-&gt;<span class="hljs-title function_ invoke__">getParameter</span>(<span class="hljs-string">&#x27;node&#x27;</span>)) {
    <span class="hljs-comment">// If there is node add its cachetag.</span>
    <span class="hljs-variable">$tags</span> = [<span class="hljs-string">&#x27;node:&#x27;</span> . <span class="hljs-variable">$node</span>-&gt;<span class="hljs-title function_ invoke__">id</span>()]
    <span class="hljs-keyword">return</span> <span class="hljs-title class_">Cache</span>::<span class="hljs-title function_ invoke__">mergeTags</span>(<span class="hljs-built_in">parent</span>::<span class="hljs-title function_ invoke__">getCacheTags</span>(), <span class="hljs-variable">$tags</span>);
  }
  <span class="hljs-comment">// Return default tags instead.</span>
  <span class="hljs-keyword">return</span> <span class="hljs-built_in">parent</span>::<span class="hljs-title function_ invoke__">getCacheTags</span>();
}

<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">getCacheMaxAge</span>(<span class="hljs-params"></span>) </span>{
  <span class="hljs-keyword">return</span> <span class="hljs-title class_">Cache</span>::<span class="hljs-variable constant_">PERMANENT</span>;
}

<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">getCacheContexts</span>(<span class="hljs-params"></span>) </span>{
  <span class="hljs-keyword">return</span> [<span class="hljs-string">&#x27;url&#x27;</span>];
}
</code></pre>
</section>

;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="cache-recap">Cache Recap</h2>
<ul>
<li>Cache expiry time govern how long the cache can be kept for.</li>
<li>Cache tags identify specific items between different caches.</li>
<li>Cache contexts identify generics.</li>
<li>Cache bubbles up to the top of the page.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

<h2 id="cache-review">Cache Review</h2>
<ul>
<li>The Cache Review module can be used to inspect the cache on a Drupal site.</li>
</ul>
<p><a href="https://www.drupal.org/project/cache_review">https://www.drupal.org/project/cache_review</a></p>
<ul>
<li>It shows how expiry time, tags and contexts work together to cache a page.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>
</section>

<li>Look at how the cache expiry, tags and context bubble up the page.</li>

<h2 id="cache-api">Cache API</h2>
<ul>
<li>Get and set data from the Drupal cache.</li>
<li>Integrates with cache tags if needed.</li>
</ul>
<p>Get data from cache.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-title class_">\Drupal</span>::<span class="hljs-title function_ invoke__">cache</span>()-&gt;<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&#x27;cache_id&#x27;</span>);
</code></pre>
<p>Save data to cache.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-title class_">\Drupal</span>::<span class="hljs-title function_ invoke__">cache</span>()-&gt;<span class="hljs-title function_ invoke__">set</span>(<span class="hljs-string">&#x27;cache_id&#x27;</span>, <span class="hljs-variable">$data</span>, <span class="hljs-variable">$max_age</span>, <span class="hljs-variable">$cache_tags</span>);
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<h2 id="cache-api-1">Cache API</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">use</span> <span class="hljs-title">Drupal</span>\<span class="hljs-title">Core</span>\<span class="hljs-title">Cache</span>\<span class="hljs-title">Cache</span>;

<span class="hljs-variable">$uid</span> = <span class="hljs-title class_">\Drupal</span>::<span class="hljs-title function_ invoke__">currentUser</span>()-&gt;<span class="hljs-title function_ invoke__">id</span>();
<span class="hljs-variable">$cache_id</span> = <span class="hljs-string">&#x27;something:&#x27;</span> . <span class="hljs-variable">$uid</span>;

<span class="hljs-keyword">if</span> (<span class="hljs-variable">$cache</span> = <span class="hljs-title class_">\Drupal</span>::<span class="hljs-title function_ invoke__">cache</span>()-&gt;<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-variable">$cache_id</span>)) {
  <span class="hljs-keyword">return</span> <span class="hljs-variable">$cache</span>-&gt;data;
}

<span class="hljs-variable">$data</span> = <span class="hljs-title function_ invoke__">massive_calculation</span>();
<span class="hljs-variable">$cache_tags</span>[] = <span class="hljs-string">&#x27;uid:&#x27;</span> . <span class="hljs-variable">$uid</span>;

<span class="hljs-title class_">\Drupal</span>::<span class="hljs-title function_ invoke__">cache</span>()-&gt;<span class="hljs-title function_ invoke__">set</span>(<span class="hljs-variable">$cache_id</span>, <span class="hljs-variable">$data</span>, <span class="hljs-title class_">Cache</span>::<span class="hljs-variable constant_">PERMANENT</span>, <span class="hljs-variable">$cache_tags</span>);

<span class="hljs-keyword">return</span> <span class="hljs-variable">$item</span>;
</code></pre>
</section>

<h2 id="templates-2">Templates</h2>
<ul>
<li>Custom templates can be defined using hook_theme().</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">my_module_theme</span>(<span class="hljs-params"></span>) </span>{
  <span class="hljs-keyword">return</span> [
    <span class="hljs-string">&#x27;my_custom_template&#x27;</span> =&gt; [
      <span class="hljs-string">&#x27;variables&#x27;</span> =&gt; [
        <span class="hljs-string">&#x27;description&#x27;</span> =&gt; <span class="hljs-string">&#x27;&#x27;</span>,
        <span class="hljs-string">&#x27;some_list&#x27;</span> =&gt; [],
      ],
    ],
  ];
}
</code></pre>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<h2 id="template">Template</h2>
<ul>
<li>The new hook can be used just like any other theme.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$build</span> = [];
<span class="hljs-variable">$build</span>[<span class="hljs-string">&#x27;content&#x27;</span>] = [
  <span class="hljs-string">&#x27;#theme&#x27;</span> =&gt; <span class="hljs-string">&#x27;my_custom_template&#x27;</span>,
  <span class="hljs-string">&#x27;#description&#x27;</span> =&gt; <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">t</span>(<span class="hljs-string">&#x27;A description.&#x27;</span>),
  <span class="hljs-string">&#x27;#some_list&#x27;</span> =&gt; [<span class="hljs-string">&#x27;item1&#x27;</span>, <span class="hljs-string">&#x27;item2&#x27;</span>],
];
</code></pre>

<ul>
<li>CSS and JavaScript are loaded using asset libraries.</li>
<li>Defined in a *.libraries.yml file.</li>
<li>A library can contain both CSS and JavaScript files.</li>
<li>Can collect together functionality.</li>
<li>Dependencies can be used to ensure libraries are loaded together.</li>
</ul>

<h2 id="libraries-attachment">Libraries Attachment</h2>
<ul>
<li>hook_page_attachments() can attach any library to any page.</li>

<h2 id="javascript-behaviours-1">JavaScript Behaviours</h2>
<ul>
<li>You can register your JavaScript with Drupal.</li>
<li>This means that the JavaScript will be loaded at appropriate times.</li>
<li>After page has loaded or when the DOM has been updated.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

}
;" data-marpit-pagination-total="204" data-size="16:9">
<h2 id="javascript-behaviours-2">JavaScript Behaviours</h2>
<ul>
<li>Inject your JavaScript file through a library.</li>
<li>Use <code>Drupal.behaviours</code> to attach new functionalty.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">(<span class="hljs-keyword">function</span>(<span class="hljs-params">$</span>){
  <span class="hljs-title class_">Drupal</span>.<span class="hljs-property">behaviors</span>.<span class="hljs-property">mymodule</span> = {
    <span class="hljs-attr">attach</span>: <span class="hljs-keyword">function</span> (<span class="hljs-params">context</span>) {
      <span class="hljs-comment">//...</span>
    }
  };
})(jQuery);
</code></pre>
<ul>
<li>Avoid collisions by adding your module name.</li>
</ul>
<footer>Philip Norton <a href="https://www.hashbangcode.com">hashbangcode.com</a> <a href="https://twitter.com/hashbangcode">@hashbangcode</a> <a href="https://twitter.com/philipnorton42">@philipnorton42</a> <a href="#1">.</a></footer>

<h2 id="javascript-behaviours-3">JavaScript Behaviours</h2>
<ul>
<li>The <code>context</code> variable is important.</li>
<li>It contains the elements being changed.</li>
<li>When the page is first loaded then this will be the entire DOM.</li>
<li>For ajax requests this will be the elements that have changed after the request.</li>
</ul>

<h2 id="javascript-behaviours-5">JavaScript Behaviours</h2>
<ul>
<li>The opposite of <code>attach</code> is <code>detach</code>.</li>
<li>This reacts upon DOM elements being removed from the page.</li>
<li>Important to detach some actions as they would otherwise keep running. e.g. a polling event for a Vue.js application.</li>
</ul>

</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">(<span class="hljs-keyword">function</span>(<span class="hljs-params">$</span>){

    <span class="hljs-attr">attach</span>: <span class="hljs-keyword">function</span> (<span class="hljs-params">context</span>) {
      <span class="hljs-comment">//...</span>
    },
    <span class="hljs-attr">detach</span>: <span class="hljs-keyword">function</span> (<span class="hljs-params">context, setting, trigger</span>) {
      <span class="hljs-keyword">if</span> (trigger == <span class="hljs-string">&#x27;unload&#x27;</span>) {
        <span class="hljs-comment">//...</span>
      }
    }
  };
})(jQuery);
</code></pre>

<h2 id="plugins-1">Plugins</h2>
<ul>
<li>Provide functionality through a common interface.</li>
<li>Most things in Drupal are actually plugins.</li>
<li>Entity types, fields, blocks, image formats, routes are all plugins.</li>
<li>You can also define custom plugins.</li>
</ul>

<h2 id="plugins---menu-item">Plugins - Menu Item</h2>
<ul>
<li>Menu links can be defined through YAML files.</li>
<li>The file <code>*.links.menu.yml</code> controlls this in your module.</li>
<li>This will create a menu item to a page of content.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">mymodule.some_menu_item:</span>
  <span class="hljs-attr">title:</span> <span class="hljs-string">&#x27;A page&#x27;</span>
  <span class="hljs-attr">description:</span> <span class="hljs-string">&#x27;A description of the link&#x27;</span>
  <span class="hljs-attr">parent:</span> <span class="hljs-string">system.admin_config_system</span>
  <span class="hljs-attr">route_name:</span> <span class="hljs-string">entity.node.canonical</span>
  <span class="hljs-attr">route_parameters:</span>
    <span class="hljs-attr">node:</span> <span class="hljs-number">123</span>
</code></pre>
<ul>
<li>Use the <code>menu_name</code> to attach this to a specific menu.</li>
</ul>
</section>

Drupal\filter\Plugin\FilterInterface::TYPE_TRANSFORM_REVERSIBLE

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">MyAmazingFilter</span> <span class="hljs-keyword">extends</span> <span class="hljs-title">FilterBase</span> </span>{
  <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">process</span>(<span class="hljs-params"><span class="hljs-variable">$text</span>, <span class="hljs-variable">$langcode</span></span>) </span>{
    <span class="hljs-variable">$result</span> = <span class="hljs-keyword">new</span> <span class="hljs-title class_">FilterProcessResult</span>(<span class="hljs-variable">$text</span>);

  }
}

</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">blockForm</span>(<span class="hljs-params"><span class="hljs-variable">$form</span>, FormStateInterface <span class="hljs-variable">$form_state</span></span>) </span>{
  <span class="hljs-variable">$form</span>[<span class="hljs-string">&#x27;setting&#x27;</span>] = [
    <span class="hljs-string">&#x27;#type&#x27;</span> =&gt; <span class="hljs-string">&#x27;textfield&#x27;</span>,    
    <span class="hljs-string">&#x27;#default_value&#x27;</span> =&gt; <span class="hljs-variable language_">$this</span>-&gt;configuration[<span class="hljs-string">&#x27;setting&#x27;</span>],
  ];
  <span class="hljs-keyword">return</span> <span class="hljs-variable">$form</span>;
}

<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">blockSubmit</span>(<span class="hljs-params"><span class="hljs-variable">$form</span>, FormStateInterface <span class="hljs-variable">$form_state</span></span>) </span>{
  <span class="hljs-variable language_">$this</span>-&gt;configuration[<span class="hljs-string">&#x27;setting&#x27;</span>] = <span class="hljs-variable">$form_state</span>-&gt;<span class="hljs-title function_ invoke__">getValue</span>(<span class="hljs-string">&#x27;setting&#x27;</span>);
}
</code></pre>
